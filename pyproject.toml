[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devimage"
version = "0.1.0"
description = "Desktop image toolbox tailored for developers and technical creators"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.8.0",
    "pillow>=10.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
    "ruff>=0.8.0",
]

[project.scripts]
devimage = "devimage.main:main"
devimage-pet = "devimage.pet_main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/devimage"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"
